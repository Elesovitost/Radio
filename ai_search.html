<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radiopaedia Vyhledávání</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --border-color: #333;
            --accent-color: #58a6ff;
            --accent-hover: #79c0ff;
            --text-primary: #e0e0e0;
            --text-secondary: #8b949e;
            --error-color: #ff4444;
            --success-color: #3fb950;
            --border-radius: 6px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: var(--spacing-lg);
            display: grid;
            place-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        main {
            background-color: var(--surface-color);
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 14px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .status-message {
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.5em;
            color: var(--text-secondary);
        }

        .status-message.error { color: var(--error-color); }
        .status-message.success { color: var(--success-color); }

        .note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>AI Radiopaedia</h1>
        </header>

        <div class="form-group">
            <label for="modelSelect">AI model</label>
            <select id="modelSelect">
                <option value="gemini:gemini-3.6-flash">Gemini 3.6 Flash</option>
                <option value="deepseek:deepseek-v4-flash">DeepSeek V4 Flash</option>
                <option value="deepseek:deepseek-v4-pro">DeepSeek V4 Pro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="patology">Hledaná patologie</label>
            <input type="text" id="patology" placeholder="např. meniscus tear MRI" autocomplete="off" autofocus>
        </div>

        <button id="submitBtn" type="button">Generovat a otevřít</button>

        <div id="status" class="status-message" aria-live="polite"></div>
        <p class="note">Text generuje zvolený model. Náhledy bere prohlížeč z Wikimedia Commons a vkládá je přímo do stránky.</p>
    </main>

    <script>
        const DEFAULT_API = 'https://radiology-ai-search.onrender.com';
        const MODEL_KEY = 'medApp_ai_model';

        const getEl = (id) => document.getElementById(id);
        const params = new URLSearchParams(location.search);
        const apiBase = (params.get('api') || DEFAULT_API).replace(/\/$/, '');

        const ui = {
            patologyInp: getEl('patology'),
            modelSelect: getEl('modelSelect'),
            submitBtn: getEl('submitBtn'),
            statusDiv: getEl('status')
        };

        const savedModel = localStorage.getItem(MODEL_KEY);
        if (savedModel && [...ui.modelSelect.options].some((o) => o.value === savedModel)) {
            ui.modelSelect.value = savedModel;
        }

        ui.modelSelect.addEventListener('change', () => {
            localStorage.setItem(MODEL_KEY, ui.modelSelect.value);
        });

        const setStatus = (message, type = '') => {
            ui.statusDiv.textContent = message;
            ui.statusDiv.className = `status-message ${type}`;
        };

        const setLoading = (isLoading) => {
            ui.submitBtn.disabled = isLoading;
            ui.patologyInp.disabled = isLoading;
            ui.modelSelect.disabled = isLoading;
        };

        const escapeHtml = (s) => String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const parseModelChoice = (value) => {
            const [provider, model] = String(value || '').split(':');
            return { provider: provider || 'gemini', model: model || 'gemini-3.6-flash' };
        };

        const buildGalleryCards = (images) => {
            const cards = (images || []).map((img) => {
                const src = img.imageUrl || img.displayUrl || '';
                if (!src) return '';
                return `
                    <figure style="margin:0;background:#0f172a;border:1px solid #334155;border-radius:10px;overflow:hidden;">
                        <a href="${escapeHtml(img.pageUrl || src)}" target="_blank" rel="noopener noreferrer">
                            <img src="${escapeHtml(src)}" alt="${escapeHtml(img.title || '')}"
                                 data-origin="${escapeHtml(img.imageUrl || src)}"
                                 loading="lazy" referrerpolicy="no-referrer"
                                 style="width:100%;height:220px;object-fit:contain;background:#020617;display:block;" />
                        </a>
                        <figcaption style="padding:10px 12px;color:#cbd5e1;font-size:13px;line-height:1.4;">
                            <strong style="color:#e2e8f0;">${escapeHtml(img.title || 'Náhled')}</strong><br/>
                            ${escapeHtml(img.description || '')}
                            <div style="margin-top:6px;font-size:11px;color:#64748b;">Zdroj: ${escapeHtml(img.source || 'wikimedia')}</div>
                        </figcaption>
                    </figure>`;
            }).join('');
            return `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;">
                    ${cards}
                </div>
                <p style="margin-top:12px;font-size:12px;color:#64748b;">
                    Náhledy z Wikimedia Commons. Radiopaedia snímky nejde vkládat (blokují vložení), proto jen odkazy.
                </p>`;
        };

        const searchWikimediaBrowser = async (query, limit = 8) => {
            const url = 'https://commons.wikimedia.org/w/api.php?' + new URLSearchParams({
                action: 'query',
                format: 'json',
                origin: '*',
                generator: 'search',
                gsrsearch: `${query} MRI CT radiology`,
                gsrnamespace: '6',
                gsrlimit: String(limit),
                prop: 'imageinfo|info',
                inprop: 'url',
                iiprop: 'url|mime|size|extmetadata',
                iiurlwidth: '720'
            });
            const data = await fetch(url).then((r) => r.json());
            const out = [];
            for (const page of Object.values(data?.query?.pages || {})) {
                const info = page.imageinfo?.[0];
                if (!info) continue;
                if (!/^image\/(jpeg|png|gif|webp)$/i.test(info.mime || '')) continue;
                const imageUrl = String(info.thumburl || info.url || '').replace(/\?utm_.*$/, '');
                if (!imageUrl) continue;
                const desc = (info.extmetadata?.ImageDescription?.value || '')
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
                out.push({
                    source: 'wikimedia',
                    title: (page.title || '').replace(/^File:/, '') || query,
                    description: (desc || query).slice(0, 280),
                    pageUrl: page.canonicalurl || info.descriptionurl || imageUrl,
                    imageUrl
                });
                if (out.length >= limit) break;
            }
            return out;
        };

        const ensureGalleryHost = (doc) => {
            let gallery = doc.getElementById('radiology-gallery');
            if (gallery) return gallery;
            const section = doc.createElement('section');
            section.style.cssText = 'padding:20px;';
            section.innerHTML = '<h2 style="color:#93c5fd;">Radiologická galerie</h2>';
            gallery = doc.createElement('div');
            gallery.id = 'radiology-gallery';
            section.appendChild(gallery);
            (doc.body || doc.documentElement).appendChild(section);
            return gallery;
        };

        const attachImageFallback = (doc) => {
            doc.querySelectorAll('#radiology-gallery img').forEach((img) => {
                if (img.dataset.fallbackBound) return;
                img.dataset.fallbackBound = '1';
                img.addEventListener('error', () => {
                    const origin = img.getAttribute('data-origin') || '';
                    const tried = img.dataset.retry || '0';
                    if (tried === '0' && origin && img.src !== origin) {
                        img.dataset.retry = '1';
                        img.src = origin;
                        return;
                    }
                    if (tried !== '2' && origin) {
                        img.dataset.retry = '2';
                        img.src = `${apiBase}/api/proxy-image?u=${encodeURIComponent(origin)}`;
                        return;
                    }
                    const box = doc.createElement('div');
                    box.style.cssText = 'padding:28px 16px;text-align:center;color:#94a3b8;background:#020617;font-size:13px;';
                    box.innerHTML = origin
                        ? `Náhled se nenačetl. <a href="${escapeHtml(origin)}" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;">Otevřít zdroj</a>`
                        : 'Náhled se nenačetl.';
                    img.replaceWith(box);
                });
            });
        };

        const fillGallery = async (doc, patology, backendImages, wikiImages) => {
            const gallery = ensureGalleryHost(doc);
            const isDirectSrc = (src) =>
                String(src || '').startsWith('data:image') ||
                /upload\.wikimedia\.org/i.test(src || '') ||
                /commons\.wikimedia\.org/i.test(src || '');
            const hasUsableImg = [...gallery.querySelectorAll('img')].some((img) =>
                isDirectSrc(img.getAttribute('src') || '')
            );

            let images = Array.isArray(backendImages) ? backendImages.filter((img) => img.imageUrl) : [];
            if (!images.length && Array.isArray(wikiImages)) images = wikiImages;
            if (!hasUsableImg && !images.length) {
                try {
                    images = await searchWikimediaBrowser(patology);
                } catch {
                    images = [];
                }
            }

            if (!hasUsableImg && images.length) {
                const radioHeading = [...gallery.querySelectorAll('h3')].find((h) => /radiopaedia/i.test(h.textContent || ''));
                const radioHtml = radioHeading?.parentElement ? radioHeading.parentElement.outerHTML : '';
                gallery.innerHTML = buildGalleryCards(images) + radioHtml;
            } else if (!hasUsableImg && !gallery.querySelector('a[href*="radiopaedia"]')) {
                gallery.insertAdjacentHTML('afterbegin', `
                    <div style="padding:16px;border:1px dashed #475569;border-radius:8px;color:#94a3b8;">
                        Nepodařilo se dohledat otevřené snímky. Zkus anglický název (např. „ACL tear MRI“).
                        <div style="margin-top:8px;">
                            <a href="https://radiopaedia.org/search?q=${encodeURIComponent(patology)}" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;">Otevřít Radiopaedia</a>
                            ·
                            <a href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(patology)}&title=Special:MediaSearch" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;">Wikimedia Commons</a>
                        </div>
                    </div>`);
            }

            attachImageFallback(doc);
            return gallery.querySelectorAll('img').length;
        };

        const handleSubmit = async () => {
            const patology = ui.patologyInp.value.trim();
            if (!patology) return setStatus('Zadejte hledanou patologii.', 'error');

            const { provider, model } = parseModelChoice(ui.modelSelect.value);
            localStorage.setItem(MODEL_KEY, ui.modelSelect.value);

            setLoading(true);
            setStatus(`Generuji přes ${provider}… (může trvat 30s+)`);

            const resultWin = window.open('', '_blank');
            if (!resultWin) {
                setStatus('Prohlížeč zablokoval vyskakovací okno. Povolte pop-ups.', 'error');
                setLoading(false);
                return;
            }

            resultWin.document.write(`
                <body style="background:#121212;color:#e0e0e0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;">
                    <h2>Analýza: ${escapeHtml(patology)}</h2>
                    <p>Model: ${escapeHtml(provider)} / ${escapeHtml(model)}</p>
                    <p style="color:#8b949e;">Hledám náhledy na Wikimedia Commons…</p>
                </body>
            `);

            const wikiPromise = searchWikimediaBrowser(patology).catch(() => []);

            try {
                const response = await fetch(`${apiBase}/api/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patology, provider, model })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
                if (!data.html) throw new Error('Backend nevrátil pole "html".');

                resultWin.document.open();
                resultWin.document.write(data.html);
                resultWin.document.close();

                const wikiImages = await wikiPromise;
                const shown = await fillGallery(resultWin.document, patology, data.images, wikiImages);
                const imgInfo = shown
                    ? ` · náhledy: ${shown}`
                    : (typeof data.imagesFound === 'number' ? ` · obrázky: ${data.imagesFound}` : '');
                setStatus(`Hotovo (${data.provider || provider} / ${data.model || model})${imgInfo}.`, 'success');
            } catch (error) {
                const msg = error.message || 'Neznámá chyba';
                setStatus(`Chyba: ${msg}`, 'error');
                resultWin.document.open();
                resultWin.document.write(`
                    <body style="background:#121212;color:#ff4444;font-family:system-ui,sans-serif;padding:2rem;">
                        <h2>Chyba při generování</h2>
                        <p>${escapeHtml(msg)}</p>
                    </body>
                `);
                resultWin.document.close();
            } finally {
                setLoading(false);
                ui.patologyInp.focus();
            }
        };

        ui.submitBtn.addEventListener('click', handleSubmit);
        ui.patologyInp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSubmit();
        });
    </script>
</body>
</html>
