<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radiopaedia Vyhledávání</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --border-color: #333;
            --accent-color: #58a6ff;
            --accent-hover: #79c0ff;
            --text-primary: #e0e0e0;
            --text-secondary: #8b949e;
            --error-color: #ff4444;
            --border-radius: 6px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: var(--spacing-lg);
            display: grid;
            place-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        main {
            background-color: var(--surface-color);
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 14px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .status-message {
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.5em;
            color: var(--text-secondary);
        }

        .status-message.error {
            color: var(--error-color);
        }

        .note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: -8px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>AI Radiopaedia</h1>
        </header>

        <div class="form-group">
            <label for="patology">Hledaná patologie</label>
            <input type="text" id="patology" placeholder="patologie..." autocomplete="off" autofocus>
        </div>

        <button id="submitBtn" type="button">Generovat a otevřít</button>

        <div id="status" class="status-message" aria-live="polite"></div>
        <p class="note">Volá backend (Render). API klíč zůstává na serveru.</p>
    </main>

    <script>
        // Nastav URL tvého Render servisu, např. https://radiology-ai-search.onrender.com
        // Lze přepsat přes ?api=https://... nebo localStorage medApp_ai_api
        const DEFAULT_API_BASE = 'http://localhost:8787';

        const getEl = id => document.getElementById(id);
        const params = new URLSearchParams(location.search);
        const API_BASE = (
            params.get('api') ||
            localStorage.getItem('medApp_ai_api') ||
            DEFAULT_API_BASE
        ).replace(/\/$/, '');

        const ui = {
            patologyInp: getEl('patology'),
            submitBtn: getEl('submitBtn'),
            statusDiv: getEl('status')
        };

        const setStatus = (message, isError = false) => {
            ui.statusDiv.textContent = message;
            ui.statusDiv.className = `status-message ${isError ? 'error' : ''}`;
        };

        const setLoading = (isLoading) => {
            ui.submitBtn.disabled = isLoading;
            ui.patologyInp.disabled = isLoading;
        };

        const escapeHtml = (s) => String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        const handleSubmit = async () => {
            const patology = ui.patologyInp.value.trim();
            if (!patology) return setStatus('Zadejte hledanou patologii.', true);

            setLoading(true);
            setStatus('Generuji interaktivní HTML (může trvat 30s+)...');

            const resultWin = window.open('', '_blank');
            if (!resultWin) {
                setStatus('Prohlížeč zablokoval vyskakovací okno. Povolte pop-ups.', true);
                setLoading(false);
                return;
            }

            resultWin.document.write(`
                <body style="background:#121212; color:#e0e0e0; font-family:system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;">
                    <h2>Analýza entity: ${escapeHtml(patology)}</h2>
                    <p>Komunikuji s backendem / LLM, prosím čekejte...</p>
                </body>
            `);

            try {
                const response = await fetch(`${API_BASE}/api/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patology })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                const htmlContent = data.html;
                if (!htmlContent) throw new Error('Backend nevrátil HTML.');

                resultWin.document.open();
                resultWin.document.write(htmlContent);
                resultWin.document.close();

                setStatus(`Hotovo${data.mode ? ` (${data.mode})` : ''}.`);
            } catch (error) {
                const msg = error.message || 'Neznámá chyba';
                setStatus(`Chyba: ${msg}`, true);
                resultWin.document.open();
                resultWin.document.write(`
                    <body style="background:#121212; color:#ff4444; font-family:system-ui, sans-serif; padding:2rem;">
                        <h2>Chyba při generování</h2>
                        <p>${escapeHtml(msg)}</p>
                        <p style="color:#8b949e; font-size:0.9rem;">API: ${escapeHtml(API_BASE)}</p>
                    </body>
                `);
                resultWin.document.close();
            } finally {
                setLoading(false);
                ui.patologyInp.focus();
            }
        };

        ui.submitBtn.addEventListener('click', handleSubmit);
        ui.patologyInp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSubmit();
        });
    </script>
</body>
</html>
