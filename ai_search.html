<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radiopaedia Vyhledávání</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --border-color: #333;
            --accent-color: #58a6ff;
            --accent-hover: #79c0ff;
            --text-primary: #e0e0e0;
            --text-secondary: #8b949e;
            --error-color: #ff4444;
            --success-color: #3fb950;
            --border-radius: 6px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: var(--spacing-lg);
            display: grid;
            place-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        main {
            background-color: var(--surface-color);
            padding: var(--spacing-lg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        header h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: var(--spacing-sm);
        }

        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 14px;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            flex: 1;
        }

        button.btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-weight: normal;
            font-size: 0.85rem;
            padding: 8px 12px;
            flex: 0 0 auto;
        }

        button.btn-secondary:hover:not(:disabled) {
            background-color: var(--border-color);
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .status-message {
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.5em;
            color: var(--text-secondary);
        }

        .status-message.error { color: var(--error-color); }
        .status-message.success { color: var(--success-color); }

        /* --- DEBUG PANEL STYLES --- */
        details.debug-panel {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: var(--spacing-sm);
            background-color: rgba(0, 0, 0, 0.2);
            font-size: 0.85rem;
        }

        details.debug-panel summary {
            cursor: pointer;
            color: var(--accent-color);
            font-weight: 600;
            user-select: none;
        }

        .debug-content {
            margin-top: var(--spacing-sm);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .debug-log {
            background: #000;
            color: #00ff66;
            font-family: monospace;
            padding: var(--spacing-sm);
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 0.75rem;
        }

        .note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin: 0;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>AI Radiopaedia</h1>
        </header>

        <!-- DEBUGGER PANEL -->
        <details class="debug-panel" id="debugPanel">
            <summary>🛠️ Debug & Nastavení API</summary>
            <div class="debug-content">
                <div class="form-group">
                    <label for="apiSelect">Cílový Backend API:</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="apiUrlInput" style="flex: 1; font-size: 0.85rem; padding: 6px 10px;">
                        <button type="button" id="pingBtn" class="btn-secondary">Test /health</button>
                    </div>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size: 0.75rem; color: var(--text-secondary);">Konzole požadavků:</span>
                    <button type="button" id="clearLogBtn" class="btn-secondary" style="padding: 2px 6px; font-size: 0.7rem;">Vyčistit</button>
                </div>
                <div id="debugLog" class="debug-log">Log prázdný...</div>
            </div>
        </details>

        <div class="form-group">
            <label for="patology">Hledaná patologie</label>
            <input type="text" id="patology" placeholder="patologie..." autocomplete="off" autofocus>
        </div>

        <button id="submitBtn" type="button">Generovat a otevřít</button>

        <div id="status" class="status-message" aria-live="polite"></div>
        <p class="note">Text generuje Gemini. Obrázky backend stáhne z otevřených zdrojů (Wikimedia / Open-i) a zobrazí přes proxy.</p>
    </main>

    <script>
        const DEFAULT_LOCAL_API = 'http://localhost:8787';

        const getEl = id => document.getElementById(id);
        const params = new URLSearchParams(location.search);

        // Získání uložené URL nebo výchozí hodnoty
        let currentApiBase = (
            params.get('api') ||
            localStorage.getItem('medApp_ai_api') ||
            DEFAULT_LOCAL_API
        ).replace(/\/$/, '');

        const ui = {
            patologyInp: getEl('patology'),
            submitBtn: getEl('submitBtn'),
            statusDiv: getEl('status'),
            apiUrlInput: getEl('apiUrlInput'),
            pingBtn: getEl('pingBtn'),
            debugLog: getEl('debugLog'),
            clearLogBtn: getEl('clearLogBtn')
        };

        ui.apiUrlInput.value = currentApiBase;

        // Pomocná logovací funkce
        const logDebug = (msg, obj = null) => {
            const time = new Date().toLocaleTimeString();
            let text = `[${time}] ${msg}`;
            if (obj) text += `\n${JSON.stringify(obj, null, 2)}`;
            
            if (ui.debugLog.textContent === 'Log prázdný...') ui.debugLog.textContent = '';
            ui.debugLog.textContent += text + '\n---\n';
            ui.debugLog.scrollTop = ui.debugLog.scrollHeight;
        };

        ui.clearLogBtn.addEventListener('click', () => {
            ui.debugLog.textContent = 'Log prázdný...';
        });

        // Uložení změny API URL
        ui.apiUrlInput.addEventListener('change', () => {
            currentApiBase = ui.apiUrlInput.value.trim().replace(/\/$/, '');
            localStorage.setItem('medApp_ai_api', currentApiBase);
            logDebug(`API URL změněna na: ${currentApiBase}`);
        });

        const setStatus = (message, type = '') => {
            ui.statusDiv.textContent = message;
            ui.statusDiv.className = `status-message ${type}`;
        };

        const setLoading = (isLoading) => {
            ui.submitBtn.disabled = isLoading;
            ui.patologyInp.disabled = isLoading;
        };

        const escapeHtml = (s) => String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        // Test přípojení /health
        ui.pingBtn.addEventListener('click', async () => {
            const url = `${currentApiBase}/health`;
            logDebug(`Odesílám PING na: ${url}`);
            setStatus('Testuji připojení...');
            
            try {
                const res = await fetch(url);
                const data = await res.json().catch(() => ({}));
                logDebug(`Odpověď z /health (Status ${res.status}):`, data);
                
                if (res.ok && data.ok) {
                    setStatus(`Backend je dostupný! (Klíč nastaven: ${data.hasKey})`, 'success');
                } else {
                    setStatus(`Backend odpovídá s chybou.`, 'error');
                }
            } catch (err) {
                logDebug(`PING Selhal: ${err.message}`);
                setStatus(`Backend nedostupný: ${err.message}`, 'error');
            }
        });

        // Hlavní odeslání
        const handleSubmit = async () => {
            const patology = ui.patologyInp.value.trim();
            if (!patology) return setStatus('Zadejte hledanou patologii.', 'error');

            setLoading(true);
            setStatus('Generuji interaktivní HTML (může trvat 30s+)...');
            logDebug(`Zahajuji požadavek /api/analyze pro entitu: "${patology}" na URL: ${currentApiBase}`);

            const resultWin = window.open('', '_blank');
            if (!resultWin) {
                setStatus('Prohlížeč zablokoval vyskakovací okno. Povolte pop-ups.', 'error');
                logDebug('Chyba: Prohlížeč zablokoval pop-up window.');
                setLoading(false);
                return;
            }

            resultWin.document.write(`
                <body style="background:#121212; color:#e0e0e0; font-family:system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;">
                    <h2>Analýza entity: ${escapeHtml(patology)}</h2>
                    <p>Komunikuji s backendem (${escapeHtml(currentApiBase)})...</p>
                </body>
            `);

            try {
                const endpoint = `${currentApiBase}/api/analyze`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ patology })
                });

                const data = await response.json().catch(() => ({}));
                logDebug(`Odpověď ze serveru (HTTP ${response.status}):`, data);

                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }

                const htmlContent = data.html;
                if (!htmlContent) throw new Error('Backend nevrátil pole "html".');

                resultWin.document.open();
                resultWin.document.write(htmlContent);
                resultWin.document.close();

                const imgInfo = typeof data.imagesFound === 'number'
                    ? ` · obrázky: ${data.imagesFound}`
                    : '';
                setStatus(`Hotovo${data.mode ? ` (${data.mode})` : ''}${imgInfo}.`, 'success');
            } catch (error) {
                const msg = error.message || 'Neznámá chyba';
                logDebug(`CHYBA při zpracování: ${msg}`);
                setStatus(`Chyba: ${msg}`, 'error');
                
                resultWin.document.open();
                resultWin.document.write(`
                    <body style="background:#121212; color:#ff4444; font-family:system-ui, sans-serif; padding:2rem;">
                        <h2>Chyba při generování</h2>
                        <p><strong>Zpráva:</strong> ${escapeHtml(msg)}</p>
                        <p style="color:#8b949e; font-size:0.9rem;"><strong>Target API:</strong> ${escapeHtml(currentApiBase)}</p>
                        <hr style="border-color:#333;">
                        <p style="color:#8b949e; font-size:0.8rem;">Zkontrolujte záložku Debug v hlavní aplikaci nebo vývojářskou konzoli (F12).</p>
                    </body>
                `);
                resultWin.document.close();
            } finally {
                setLoading(false);
                ui.patologyInp.focus();
            }
        };

        ui.submitBtn.addEventListener('click', handleSubmit);
        ui.patologyInp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSubmit();
        });
    </script>
</body>
</html>
