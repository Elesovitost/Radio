services:
  - type: web
    name: radiology-ai-search
    runtime: node
    plan: free
    rootDir: ai-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NODE_VERSION
        value: "20"
